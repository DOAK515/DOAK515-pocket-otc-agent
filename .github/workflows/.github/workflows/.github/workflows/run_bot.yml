name: Pocket Option OTC Bot

on:
  workflow_dispatch:  # التشغيل اليدوي المباشر بضغطة زر
  schedule:
    - cron: '0 */6 * * *'  # يعمل مرة كل 6 ساعات كخلفية آمنة بدون تكرار مزعج

concurrency:
  group: pocket-bot-single-instance
  cancel-in-progress: true  # يمنع فتح أي أمر جديد إذا كان هناك أمر قديم يعمل بالفعل

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy pytz matplotlib

    - name: Run bot
      run: python bot.py
