name: Run OTC Bot

on:
  schedule:
    - cron: '*/10 * * * *' # يتم إعادة تشغيل البوت كل 10 دقائق لضمان استمراريته وعدم توقفه
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت متى شئت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy matplotlib pytz

    - name: Run bot
      run: |
        python bot.py
