name: Run OTC Bot

on:
  schedule:
    - cron: '0 * * * *'  # يعمل تلقائياً مع بداية كل ساعة جديدة
  workflow_dispatch:      # لكي تستطيع تشغيله يدوياً متى شئت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas yfinance pytz matplotlib

    - name: Run bot
      run: |
        python bot.py
