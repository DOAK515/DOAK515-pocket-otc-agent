name: OTC Trading Signal Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *" # يعمل تلقائياً كل 10 ثواني للبحث عن إشارات

concurrency:
  group: otc-signal-bot-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot pandas numpy matplotlib requests

      - name: Run Signal Bot
        run: python bot.py
