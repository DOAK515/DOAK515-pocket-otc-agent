name: Run Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # يتم تشغيل البوت تلقائياً كل 5 دقائق
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy pytz matplotlib

      - name: Run bot script
        run: |
          python bot.py
