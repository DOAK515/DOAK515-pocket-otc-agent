name: Pocket Option Bot Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # يعمل تلقائياً كل 30 دقيقة

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install requests pandas numpy pytz matplotlib
    - run: python bot.py
