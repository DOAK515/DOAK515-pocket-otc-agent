name: EURUSD OTC Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: eurusd-otc-signal-bot
  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 29

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install PocketOption API
        run: |
          python -m pip install \
            "git+https://github.com/chema-creator/PocketOptionApi.git"

      - name: Install dependencies
        run: |
          python -m pip install \
            requests \
            pandas \
            numpy \
            pytz \
            matplotlib

      - name: Verify installation
        run: |
          python - <<'PY'
          from pocketoptionapi import PocketOption
          print("PocketOption API OK")
          print("EURUSD_otc configured")
          print("60-second candles configured")
          PY

      - name: Check secrets
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$PO_SSID" ]; then
            echo "ERROR: PO_SSID is missing"
            exit 1
          fi

          if [ "$PO_SSID" = "17092" ]; then
            echo "ERROR: PO_SSID contains only UID"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          echo "Required secrets exist."

      - name: Run bot
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
