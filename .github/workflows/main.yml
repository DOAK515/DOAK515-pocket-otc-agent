name: Pocket Option OTC Bot

on:
  workflow_dispatch:

concurrency:
  group: pocket-option-otc-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy pytz matplotlib
          python -m pip install git+https://github.com/chema-creator/PocketOptionApi.git

      - name: Test PocketOption API
        run: |
          python -c "from pocketoptionapi import PocketOption; print('PocketOption API import OK')"

      - name: Check secrets
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$PO_SSID" || (echo "ERROR: PO_SSID is missing" && exit 1)
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "ERROR: TELEGRAM_BOT_TOKEN is missing" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "ERROR: TELEGRAM_CHAT_ID is missing" && exit 1)
          echo "All required secrets are configured."

      - name: Run bot
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
