name: EURUSD OTC Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: eurusd-otc-signal-bot
  cancel-in-progress: true

jobs:
  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install \
            binaryoptionstoolsv2 \
            requests \
            pandas \
            numpy \
            pytz \
            matplotlib

      - name: Verify BinaryOptionsToolsV2
        run: |
          python - <<'PY'
          from BinaryOptionsToolsV2.pocketoption import PocketOptionAsync
          print("BinaryOptionsToolsV2 OK")
          print("PocketOptionAsync OK")
          PY

      - name: Check Secrets
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$PO_SSID" ]; then
            echo "ERROR: PO_SSID is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          echo "All required secrets exist."

      - name: Run bot
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
