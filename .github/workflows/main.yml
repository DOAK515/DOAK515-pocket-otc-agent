name: EURUSD OTC Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: eurusd-otc-signal-bot
  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install BinaryOptionsToolsV2
        run: |
          python -m pip install binaryoptionstoolsv2

      - name: Install other dependencies
        run: |
          python -m pip install \
            requests \
            pandas \
            numpy \
            pytz \
            matplotlib

      - name: Verify Pocket Option library
        run: |
          python - <<'PY'
          from BinaryOptionsToolsV2.pocketoption import PocketOptionAsync

          print("===================================")
          print("BinaryOptionsToolsV2: OK")
          print("PocketOptionAsync: OK")
          print("===================================")
          PY

      - name: Check Secrets
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |

          if [ -z "$PO_SSID" ]; then
            echo "ERROR: PO_SSID is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is missing"
            exit 1
          fi

          echo "==================================="
          echo "All required secrets exist."
          echo "==================================="

      - name: Start EURUSD OTC bot
        env:
          PO_SSID: ${{ secrets.PO_SSID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u bot.py
