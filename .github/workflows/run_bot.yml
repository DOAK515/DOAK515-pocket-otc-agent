name: Run Pocket Option OTC Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # يسمح لك بتشغيله يدوياً متى شئت بضغطة زر
  schedule:
    - cron: '*/10 * * * *'  # يعمل تلقائياً كل 10 دقائق لضمان استمرار البوت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy pytz matplotlib

    - name: Run bot script
      run: python bot.py
